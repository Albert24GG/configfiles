# Start app daemon needed by uwsm-app
exec-once=systemctl --user start wayland-wm-app-daemon.service

# Status bar, notifications and osd
exec-once=uwsm app -s b -- dms run

# Screen Sharing
exec-once=dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP

# Fix alsamixer internal mic boost
#exec=alsactl --file ~/.config/asound.state restore

# Start polkit
exec-once=systemctl --user start hyprpolkitagent.service

# Clipboard manager 
exec-once=uwsm app -s b -- clipse -listen
